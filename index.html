<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interacive webpage</title>
    <script src="elements.js" defer></script>
    
</head>
<body>
    <h1>Interactive webpage</h1>

    <h2>
        Welcome to the interactive webpage, here you will find some interactable elements<br/>
        that will change the HTML page seamlessly in some way.
    </h2>

    <h2>
        Here are some interactable elements:
    </h2>

    <h3>
        1. Dark/Light mode button
    </h3>

    <button id="colorbutton">Theme</button>

    <h3>2. Word saver button</h3>

    <div>
    <input id = "random_word">

    <button id="submit_button">Submit</button>

    <button id="reset_button">Reset</button>
    </div>

    <ul id="random_word_display"></ul>

    <h3>
        3. Page alignment button
    </h3>

    <button id="alignment_button">Align</button>



</body>
</html>
